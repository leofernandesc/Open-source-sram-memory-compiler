<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
<title id="title">Varredura SS de fase captura para PCLK com PEX combinado</title>
<desc id="desc">Matrizes de 24 transições e cargas em quatro fases. A queda ideal de PCLK permanece em 20.70 ns. O gráfico compara casos que passam a margem de 250 ps e o maior WL90.</desc>
